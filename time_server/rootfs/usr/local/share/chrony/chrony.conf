# Base configuration. init-chrony writes /etc/chrony/chrony.conf from it on
# every start and adds the servers, the allowed networks and the local fallback.

# The frequency error of the host clock, kept across restarts, so offset and
# skew are settled soon after a start
driftfile /data/chrony/drift
# Step the clock when it is off by more than a second in the first three
# updates, slew it after that (no effect while set_system_clock is off)
makestep 1 3
# Answer each client on average at most once in two seconds, in bursts of up
# to 16; floods from one address are dropped (counted as dropped requests)
ratelimit interval 1 burst 16
# Memory for chrony's client log, chrony's default made explicit: it bounds how
# many addresses chrony, and with it the web page, can know at a time
clientloglimit 524288
