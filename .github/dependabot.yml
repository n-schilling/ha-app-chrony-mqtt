version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The base image in time_server/Dockerfile
  - package-ecosystem: docker
    directory: /time_server
    target-branch: dev
    schedule:
      interval: weekly
