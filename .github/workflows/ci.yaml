name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so a new base image or linter release that breaks the build shows up
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App configuration
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./chrony_ntp
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh chrony_ntp/CHANGELOG.md "$(yq -r '.version' chrony_ntp/config.yaml)" > /dev/null
      - name: Shell scripts
        run: >-
          shellcheck --shell=bash --severity=warning --external-sources
          chrony_ntp/rootfs/etc/s6-overlay/s6-rc.d/*/run
          chrony_ntp/rootfs/usr/local/lib/mqtt-device.sh
          chrony_ntp/rootfs/usr/local/bin/chrony-mqtt-kpi
          chrony_ntp/rootfs/etc/s6-overlay/s6-rc.d/chrony/finish
          scripts/check.sh
          tests/test_app.sh tests/test_broker.sh tests/stubs/chronyc tests/stubs/mosquitto_*
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python
        run: |
          pip install ruff==0.17.3
          ruff check chrony_ntp/rootfs/usr/local/lib tests

  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(yq -r '.version' chrony_ntp/config.yaml)
          docker buildx build --platform "${PLATFORM}" \
            --build-arg "BUILD_VERSION=${version}" --load -t chrony-mqtt:test chrony_ntp
      - name: Test
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm --network none --platform "${PLATFORM}"
          -v "${PWD}/tests:/tests:ro" --entrypoint bash chrony-mqtt:test
          /tests/test_app.sh
      - name: Test the web page
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm --network none --platform "${PLATFORM}"
          -v "${PWD}/tests:/tests:ro" --entrypoint python3 chrony-mqtt:test
          -m unittest discover -v -s /tests -p 'test_*.py'

  page:
    name: Page
    # The ingress page as Home Assistant shows it: the built image with made-up
    # data behind a stand-in for the ingress proxy, in a headless browser
    # (STANDARD.md, sections 7 and 8). scripts/screenshots.py also takes the screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' chrony_ntp/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" \
            -t chrony-mqtt:test chrony_ntp
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Browser
        # The runner's Google Chrome; Playwright's own Chromium only without it
        # (Playwright 1.58 cannot install it on Ubuntu 26.04)
        run: |
          pip install playwright==1.58.0
          google-chrome --version || python -m playwright install --with-deps chromium
      - name: Check the page
        run: python scripts/screenshots.py --check --image chrony-mqtt:test

  broker:
    name: Against a real MQTT broker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' chrony_ntp/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" \
            -t chrony-mqtt:test chrony_ntp
      - name: Start the broker
        run: |
          docker network create ci
          docker run -d --name broker --network ci \
            -v "${PWD}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2.1.2-alpine
      - name: Test
        run: >-
          docker run --rm --network ci --add-host supervisor:127.0.0.1 -v "${PWD}/tests:/tests:ro" --entrypoint bash
          chrony-mqtt:test /tests/test_broker.sh
      - name: Broker log
        if: failure()
        run: docker logs broker

