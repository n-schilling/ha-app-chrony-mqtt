name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

# Not on main: a commit reaches main only after CI passed for it on dev, and
# the release workflow checks that before it tags (ci-passed.sh)
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # Weekly, so a new base image or linter release that breaks the build shows up
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App configuration
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./time_server
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh time_server/CHANGELOG.md "$(yq -r '.version' time_server/config.yaml)" > /dev/null
      - name: Shell scripts
        run: >-
          shellcheck --shell=bash --severity=warning --external-sources
          time_server/rootfs/etc/s6-overlay/s6-rc.d/*/run
          time_server/rootfs/usr/local/lib/mqtt-device.sh
          time_server/rootfs/usr/local/bin/chrony-mqtt-kpi
          time_server/rootfs/etc/s6-overlay/s6-rc.d/chrony/finish
          scripts/check.sh
          tests/test_app.sh tests/test_broker.sh tests/stubs/chronyc tests/stubs/mosquitto_*
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python
        run: |
          pip install ruff==0.17.3
          ruff check time_server/rootfs/usr/local/lib tests

  test:
    name: Build and test (${{ matrix.arch }})
    # Each architecture on a runner of its own kind, no emulation: the image
    # is built and tested natively (the arm64 runners are free for public
    # repositories)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' time_server/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" -t time-server:test time_server
      - name: Image architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' time-server:test)
          echo "image: ${arch}"
          [[ "${ARCH}/${arch}" == amd64/amd64 || "${ARCH}/${arch}" == aarch64/arm64 ]]
      - name: Test
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint bash time-server:test
          /tests/test_app.sh
      - name: Test the web page
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint python3 time-server:test
          -m unittest discover -v -s /tests -p 'test_*.py'

  broker:
    name: Against a real MQTT broker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' time_server/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" \
            -t time-server:test time_server
      - name: Start the broker
        run: |
          docker network create ci
          docker run -d --name broker --network ci \
            -v "${PWD}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2.1.2-alpine
      - name: Test
        run: >-
          docker run --rm --network ci --add-host supervisor:127.0.0.1 -v "${PWD}/tests:/tests:ro" --entrypoint bash
          time-server:test /tests/test_broker.sh
      - name: Broker log
        if: failure()
        run: docker logs broker
